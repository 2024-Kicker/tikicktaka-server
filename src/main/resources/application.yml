spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    auth-code-expiration-millis: 1800000
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        show_sql: true
        format_sql: true
        use_sql_comments: true
        hbm2ddl:
          auto: update
        default_batch_fetch_size: 1000
  servlet:
    multipart:
      enabled: true
      maxFileSize: 1000MB
      maxRequestSize: 1000MB
  data:
    redis:
      host: localhost
      port: 6379
      inviteCode:
        key:
          prefix: "inviteCode:"

jwt:
  token:
    secret: ${JWT_TOKEN_SECRET}

oauth:
  kakao:
    client-id: ${CLIENT_ID}
    url:
      auth: https://kauth.kakao.com
      api: https://kapi.kakao.com

cloud:
  aws:
    s3:
      bucket: tikicktaka-bucket
      path:
        member : member
        logo : logo
        stadium : stadium
    region:
      static: ap-northeast-2
    stack:
      auto: false
    credentials:
      accessKey: ${AWS_ACCESS_KEY_ID}
      secretKey: ${AWS_SECRET_ACCESS_KEY}

coolsms:
  api:
    key: ${COOLSMS_API_KEY}
    secret: ${COOLSMS_SECRET_KEY}
    number: ${COOLSMS_NUMBER}


socketio:
  host: localhost  # 모든 IP에서 접근 가능하도록 설정
  port: 8082  # 웹소켓 서버 포트 (ws://localhost:8081)
  boss-count: 1
  work-count: 100
  allow-custom-requests: true
  upgrade-timeout: 10000
  ping-interval: 25000
  ping-timeout: 60000
  max-frame-payload-length: 1048576
  max-http-content-length: 1048576
  allow-headers: "*"
  allow-origin: "*"
  allow-method: "GET,POST"
  allow-credentials: true

